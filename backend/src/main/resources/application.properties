spring.application.name=inventarymanagement

# MySQL configuration
spring.datasource.url=jdbc:mysql://localhost:3306/inventary?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin522
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jackson.mapper.accept-case-insensitive-enums=true

# API and observability
server.error.include-message=always
management.endpoints.web.exposure.include=health,info
app.poc-id=POC-07

# JWT configuration
app.jwt.secret=ChangeThisSecretKeyToASecure32CharMinimumValue12345
app.jwt.expiration-ms=1800000
